# ~/.tmux/theme.conf -- Catppuccin status bar, sourced by tmux.conf on tmux 3.2+

set -g @catppuccin_flavor 'mocha'
# Powerline arrows as in the powerlevel10k prompt
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator '#[fg=#{@_ctp_status_bg},reverse]#[none]'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '#[fg=#{@_ctp_status_bg},reverse]#[none]'
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_host_text ' #h'
set -g @catppuccin_date_time_text ' %a %d %b %H:%M'

run '~/.tmux/catppuccin/catppuccin.tmux'

# -F expands the modules now, exposing #{cpu_percentage} etc. to the TPM plugins
set -g status-left-length 100
set -g status-right-length 200
set -g status-left '#{E:@catppuccin_status_session}'
set -gF status-right '#{E:@catppuccin_status_weather}'
set -agF status-right '#{E:@catppuccin_status_cpu}'
set -agF status-right '#{E:@catppuccin_status_ram}'
set -agF status-right '#{E:@catppuccin_status_load}'
set -agF status-right '#{E:@catppuccin_status_host}'
if-shell 'ls /sys/class/power_supply/BAT* >/dev/null 2>&1' "set -agF status-right '#{E:@catppuccin_status_battery}'"
set -agF status-right '#{E:@catppuccin_status_date_time}'
