# ~/.tmux.conf -- symlinked from this repo by install.sh

# --- general ---------------------------------------------------------------

set -g mouse on
set -g focus-events on
set -ga terminal-overrides ",*256col*:Tc"   # true color for the theme's hex colors
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top   # keep the bar away from the shell prompt

# --- copy mode -------------------------------------------------------------

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# vim-tmux-navigator takes C-l, so clear the screen with <prefix> C-l instead
bind C-l send-keys C-l

# --- plugins ---------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'       # restore automatically
set -g @continuum-save-interval '5'  # save every 5 minutes

set -g @tmux-weather-location 'Zurich'
set -g @tmux-weather-format '%t'   # no emoji: tmux and the terminal disagree on its width

# --- theme -----------------------------------------------------------------

# Catppuccin needs tmux 3.2+; older versions (Levante) keep the default status bar.
# It must load before TPM so the plugins can fill in the placeholders it sets.
if-shell '[ "$(printf "3.2\n%s\n" "$(tmux -V | cut -d" " -f2)" | sort -V | head -n1)" = 3.2 ]' 'source-file ~/.tmux/theme.conf'

run '~/.tmux/plugins/tpm/tpm'
